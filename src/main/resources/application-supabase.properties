# Activate with -Dspring-boot.run.profiles=supabase.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.jxnpxymmxypfhhfcoimf}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Keep application tables outside Supabase's default public Data API schema.
spring.jpa.properties.hibernate.default_schema=mavworks
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.default-schema=mavworks
spring.flyway.schemas=mavworks
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
