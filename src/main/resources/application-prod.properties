# Set these values in the hosting platform's environment/secrets manager.
# No localhost URL or local credentials are used in production.
vaadin.launch-browser=false
vaadin.productionMode=true
mavworks.public-base-url=${MAVWORKS_PUBLIC_BASE_URL}
spring.mail.host=${SMTP_HOST}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
mavworks.mail.from=${MAIL_FROM}
server.servlet.session.cookie.secure=true
